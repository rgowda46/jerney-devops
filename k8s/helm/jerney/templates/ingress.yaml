apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: jerney-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: jerney-frontend
                port:
                  number: 80

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: jerney-backend
                port:
                  number: 5000
