apiVersion: apps/v1
kind: Deployment

metadata:
  name: jerney-frontend
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: jerney-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: jerney-frontend

    spec:
      automountServiceAccountToken: false

      containers:
        - name: frontend

          image: {{ .Values.frontend.image }}

          ports:
            - containerPort: {{ .Values.frontend.port }}
              protocol: TCP
