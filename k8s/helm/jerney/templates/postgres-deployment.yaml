apiVersion: apps/v1
kind: Deployment

metadata:
  name: jerney-db
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: jerney-db

  template:
    metadata:
      labels:
        app.kubernetes.io/name: jerney-db

    spec:
      automountServiceAccountToken: false

      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}

          ports:
            - containerPort: 5432
              protocol: TCP

          envFrom:
            - secretRef:
                name: jerney-db-secret

          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata

      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: jerney-db-pvc
